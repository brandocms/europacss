[package]
name = "europacss"
version = "0.1.0"
edition = "2021"
publish = false
license = "MIT"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
lightningcss = { version = "=1.0.0-alpha.72", default-features = false, features = ["sourcemap", "browserslist"] }
parcel_sourcemap = { version = "2", features = ["json"] }
toml = { version = "0.9", features = ["preserve_order"] }
pathdiff = "0.2"

[[bin]]
name = "europa"
path = "src/main.rs"

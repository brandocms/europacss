# Comments work throughout TOML. Slash names and $collections use quoted keys.
enabled = true

[theme.breakpoints]
mobile = "0"
tablet = "740px"
desktop = "1024px"

[theme.breakpointCollections]
"$sm" = "mobile/tablet"
"$lg" = "desktop"

[theme.colors]
ink = "#163442"
text = "{colors.ink}" # Reuse another token without a callback.
accent = "#fc7444"

[theme.spacing.md]
mobile = "16px"
tablet = "24px"
desktop = "32px"

[theme.typography.families]
sans = ["Inter", "sans-serif"]

[theme.typography.sizes.base]
mobile = "16px"
tablet = "18px"
desktop = "20px"

[theme.typography.sizes.base.__base__]
font-family = "{typography.families.sans}"
line-height = "150%"

# One named style: shared properties, then breakpoint-specific overrides.
[theme.typography.sizes."heading/4xl"]
__base__.font-family = "{typography.families.sans}"
__base__.font-weight = 600
__base__.line-height = 1.1
__base__.letter-spacing = "-0.025em"

mobile = { font-size = "32px", line-height = 1.15 }
tablet = { font-size = "48px" }
desktop = { font-size = "clamp(48px, 4vw, 72px)", letter-spacing = "-0.04em" }

[package]
name = "europacss-wasm"
version = "0.1.0-beta.2"
edition = "2021"
publish = false
license = "MIT"
description = "EuropaCSS compiler as an import-free WebAssembly module"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
europacss = { path = "../europacss" }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }

# Lightning CSS seeds ahash through getrandom; .cargo/config.toml selects the
# custom backend below so the module needs no JavaScript imports.
[target.'cfg(target_arch = "wasm32")'.dependencies]
getrandom = "0.3"
